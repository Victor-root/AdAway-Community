import javax.inject.Inject

/**
 * Packages the executables built by ndk-build as lib<name>_exec.so.
 * If they look like libraries, they are packaged in the apk and deployed on the device in the lib folder!
 * Each module builds a stub lib<name>_exec.so shared library to declare it, which this replaces.
 *
 * AGP reads the native libraries from two places depending on the variant and the consumer: the
 * ndk-build output (intermediates/cxx/<BuildType>/<hash>/obj/local/<abi>) and its legacy copy
 * (intermediates/ndkBuild/<buildType>/obj/local/<abi>). The stub is replaced in both, by one task
 * per build type wired to that build type's own consumers, so every variant packages its own
 * executables whatever other tasks run in the same build.
 *
 * Help with files: https://docs.gradle.org/current/userguide/working_with_files.html
 */
abstract class RenameNativeExecutablesTask extends DefaultTask {
    /**
     * The module intermediates directory.
     */
    @Internal
    abstract DirectoryProperty getIntermediatesDirectory()

    /**
     * The build type, capitalized (Debug or Release).
     */
    @Input
    abstract Property<String> getBuildType()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void rename() {
        File intermediates = intermediatesDirectory.get().asFile
        String buildType = this.buildType.get()
        List<File> objFolders = [new File(intermediates, "ndkBuild/${buildType.toLowerCase()}/obj/local")]
        File cxxFolder = new File(intermediates, "cxx/${buildType}")
        if (cxxFolder.isDirectory()) {
            cxxFolder.eachDir { File hashFolder -> objFolders.add(new File(hashFolder, 'obj/local')) }
        }
        objFolders.findAll { it.isDirectory() }.each { File objFolder ->
            fileSystemOperations.copy { CopySpec spec ->
                spec.from(objFolder) { CopySpec from ->
                    // Only the executables, at <abi>/<name>
                    from.include '*/*'
                    from.exclude '**/*.a', '**/*.d', '**/*.o', '**/*.so', '**/*.txt'
                }
                spec.into objFolder
                spec.rename '(.+)', 'lib$1_exec.so'
            }
            logger.info("Packaged the executables of ${objFolder}")
        }
    }
}

['Debug', 'Release'].each { String buildType ->
    def renameTask = tasks.register("renameJniLibAsExecutable${buildType}", RenameNativeExecutablesTask) {
        dependsOn "externalNativeBuild${buildType}"
        intermediatesDirectory = layout.buildDirectory.dir('intermediates')
        it.buildType = buildType
    }

    // merge<BuildType>NativeLibs, copy<BuildType>JniLibsProjectOnly and copy<BuildType>JniLibsProjectAndLocalJars
    tasks.matching {
        it.name == "merge${buildType}NativeLibs" || it.name.startsWith("copy${buildType}JniLibsProject")
    }.configureEach {
        dependsOn renameTask
    }
}
