apply plugin: 'com.android.library'

android {
    compileSdk 33
    ndkVersion '27.2.12479018'
    namespace 'org.adaway.webserver'

    defaultConfig {
        minSdk 26
        targetSdk 33
    }

    buildFeatures {
        prefab = true
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
}

dependencies {
    implementation libs.openssl
}

apply from: rootProject.file('gradle/native-executables.gradle')
