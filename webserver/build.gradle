apply plugin: 'com.android.library'

android {
    compileSdk 33
    ndkVersion '27.2.12479018'
    namespace 'org.adaway.webserver'

    defaultConfig {
        minSdk 26
        targetSdk 33
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
}

apply from: rootProject.file('gradle/native-executables.gradle')
